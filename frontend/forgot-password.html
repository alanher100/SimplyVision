<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimplyVision | Forgot Password</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <main class="login-page">
        <img
            class="logo"
            src="assets/simplyvision-logo.png"
            alt="SimplyVision logo"
        >

        <div class="basketball-banner"></div>

        <section class="login-card">
            <h1>Forgot Your Password?</h1>
            <p>
                Enter your email address below to request
                a password reset link.
            </p>

            <form id="forgotPasswordForm" novalidate>
                <label for="email">Email address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="name@simplybasketball.com"
                    required
                >

                <!-- Sprint 2: Email validation messages -->
                <p id="errorMessage" role="status" aria-live="polite"></p>

                <button type="submit">Request Reset Link</button>

                <a class="forgot back-to-login" href="login.html">
                    Back to Sign In
                </a>
            </form>
        </section>
    </main>

    <footer>
        <div class="contact">
            For more information, contact
            terence.ching@simplybasketball.com
        </div>

        <div class="about">
            <strong>What is Simply Basketball?</strong>
            <p>
                Simply Basketball provides high quality
                basketball content and coverage for
                NorCal Basketball.
            </p>
        </div>
    </footer>

    <script src="forgot-password.js"></script>
</body>
</html>
