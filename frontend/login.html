
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimplyVision | Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <main class="login-page">
        <img
            class="logo"
            src="assets/simplyvision-logo.png"
            alt="SimplyVision logo"
        >

        <div class="basketball-banner"></div>

        <section class="login-card">
            <h1>Welcome</h1>
            <p>Sign in to continue to SimplyVision.</p>

            <form>
                <label for="email">Email address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="name@simplybasketball.com"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <a class="forgot" href="#">
                    Forgot password?
                </a>

                <button type="button">Sign in</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="contact">
            For more information, contact
            terence.ching@simplybasketball.com
        </div>

        <div class="about">
            <strong>What is Simply Basketball?</strong>
            <p>
                Simply Basketball provides high quality
                basketball content and coverage for
                NorCal Basketball.
            </p>
        </div>
    </footer>

</body>
</html>
