
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Candidate Clips | SimplyVision</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../components/sidebar.css">
</head>
<body>


<!-- Shared reusable sidebar -->
<div id="sidebar-container"></div>


<div class="workspace">
    <header class="top-header">
        <div class="heading">
            <h1>All Candidate Clips</h1>
            <p>View and manage your candidate clip review queue.</p>
        </div>

        <a href="index.html">← Back to Review</a>
    </header>

    <main class="all-clips-page">

    <!-- All Clips Reviewed banner -->
        <div id="all-clips-complete" class="all-clips-complete" hidden>
            <strong>✓ All Clips Reviewed!</strong>
            <p>You've finished reviewing all candidate clips.</p>
        </div>

        <section class="clip-summary">
            <div>
                <h2>Pending</h2>
                <p id="pending-count">0</p>
            </div>

            <div>
                <h2>Confirmed</h2>
                <p id="confirmed-count">0</p>
            </div>

            <div>
                <h2>Rejected</h2>
                <p id="rejected-count">0</p>
            </div>
        </section>

        <section class="all-clips-list">
            <h2>All Clips</h2>
            <div id="all-clips-container"></div>
        </section>
    </main>
</div>

<script src="../components/sidebar.js"></script>

<script src="all-clips.js"></script>

<script src="../logout.js"></script>

</body>
</html>
